# SonarCloud Configuration
sonar.projectKey=TheDanah_SE-Project
sonar.organization=thedanah

# Sources - explicitly include all JS files
sonar.sources=.
sonar.inclusions=**/*.js,**/*.html
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,dist/**,.git/**,coverage/**,*.json

# JavaScript specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
